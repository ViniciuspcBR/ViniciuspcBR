# Nome que aparece na aba "Actions" do GitHub
name: Metrics

# QUANDO a tarefa roda
on:
  # Todo dia à meia-noite (UTC). Formato cron: minuto hora dia mês dia-da-semana
  schedule: [{cron: "0 0 * * *"}]
  # Sempre que você enviar algo para a branch main
  push: {branches: ["main"]}
  # Permite rodar manualmente pelo botão "Run workflow"
  workflow_dispatch:

# O QUE roda
jobs:
  github-metrics:
    # Máquina virtual (Linux) que o GitHub empresta para executar a tarefa
    runs-on: ubuntu-latest
    # Autoriza a tarefa a gravar (commitar) arquivos no seu repositório
    permissions:
      contents: write
    steps:
      # PASSO 1: o "fotógrafo" gera o SVG e o salva no repositório
      - uses: lowlighter/metrics@latest
        with:
          # Nome do arquivo SVG que será criado no repositório
          filename: metrics.plugin.isocalendar.fullyear.svg
          # Seu token guardado como segredo (nunca escreva o token aqui)
          token: ${{ secrets.METRICS_TOKEN }}
          # Não gera o bloco padrão de métricas, só o que pedimos abaixo
          base: ""
          # Liga o plugin do calendário isométrico
          plugin_isocalendar: yes
          # Mostra o ano inteiro (o padrão seria meio ano)
          plugin_isocalendar_duration: full-year

      # PASSO 2: baixa o repositório já com o SVG recém-gerado.
      # "ref" força pegar a ponta atual da branch (e não o commit antigo que disparou a tarefa)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # PASSO 3: o "retocador" troca a cor do chão e move as legendas
      - name: Retocar o SVG
        run: python3 .github/scripts/patch-isocalendar.py metrics.plugin.isocalendar.fullyear.svg

      # PASSO 4: se o arquivo mudou, salva o resultado retocado no repositório
      - name: Salvar se mudou
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metrics.plugin.isocalendar.fullyear.svg
            git commit -m "Retocar calendário isométrico"
            git push
          fi
